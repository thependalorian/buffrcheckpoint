# Daily database recovery point (SOC 2 A1.2). Skips quietly until the NEON_API_KEY secret is added.
name: Neon daily snapshot
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Snapshot
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then echo "NEON_API_KEY is not set; skipping"; exit 0; fi
          ./scripts/neon-daily-snapshot.sh
