# Checks every push and pull request. Blocking: typecheck, tests, build and the
# secrets scan. Lint and the dependency audit report without blocking until the
# existing lint findings are cleared (buffrcheckpoint.md 11.1c, CI pipeline).
# The dependency audit blocks at high severity since 2026-10-06 (all four packages audit clean).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            typecheck: npx tsc --noEmit -p tsconfig.build.json
            test: npx jest --ci
          - app: admin
            typecheck: npx next typegen && npx tsc --noEmit
            test: npx vitest run
          - app: ops-console
            typecheck: npx next typegen && npx tsc --noEmit
            test: npx vitest run
          - app: website
            typecheck: npx next typegen && npx tsc --noEmit
            test: npx vitest run
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: ${{ matrix.typecheck }}
      - name: Test
        if: matrix.test != ''
        run: ${{ matrix.test }}
      - name: Build
        run: npm run build
      - name: Lint (reporting)
        continue-on-error: true
        run: npx biome ci .
      - name: Dependency audit (blocking at high; SECURITY.md sets the fix times)
        run: npm audit --omit=dev --audit-level=high

  migrations:
    # Every migration must replay cleanly on an empty database: that is how a
    # new environment or a disaster-recovery rebuild is created. Production was
    # verified identical to such a replay on 2026-10-02 (indexes, columns,
    # constraints).
    name: migrations replay
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: replay
          POSTGRES_PASSWORD: replay
          POSTGRES_DB: replay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U replay" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: replay
      PGPASSWORD: replay
      PGDATABASE: replay
    steps:
      - uses: actions/checkout@v4
      - name: Create runtime roles
        run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE buffr_checkpoint_app; CREATE ROLE buffr_checkpoint_runtime;"
      - name: Replay migrations in order
        run: for f in backend/db/migrations/*.sql; do echo "$f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Wiebe guards (no triggers, cascades or CHECK lists)
        run: |
          test "$(psql -tA -c "select count(*) from pg_trigger where not tgisinternal")" = "0"
          test "$(psql -tA -c "select count(*) from pg_constraint where connamespace='public'::regnamespace and confdeltype='c'")" = "0"
          test "$(psql -tA -c "select count(*) from pg_constraint where connamespace='public'::regnamespace and contype='c'")" = "0"

  secrets:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
