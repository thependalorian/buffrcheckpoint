# Dependency monitoring (SOC 2 CC7.1). Generated 2026-10-06; see buffr-ai/BUFFR_ID_AND_DOMAINS.md C9.
# Cool-down mirrors the workspace rule: nothing published in the last 7 days is proposed.
# Security updates are not delayed by the cool-down.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/admin"
      - "/backend"
      - "/ops-console"
      - "/shared"
      - "/website"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
